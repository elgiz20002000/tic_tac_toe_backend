map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name api.ticdactoe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_name api.ticdactoe.com;

    ssl_certificate /etc/letsencrypt/live/api.ticdactoe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ticdactoe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name grafana.ticdactoe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_name grafana.ticdactoe.com;

    # Same files as API — no separate live/grafana... directory. After DNS for grafana works, add SAN and reload nginx, e.g.:
    # certbot certonly --webroot -w $(pwd)/nginx/certbot-webroot --cert-name api.ticdactoe.com --expand -d api.ticdactoe.com -d grafana.ticdactoe.com
    ssl_certificate /etc/letsencrypt/live/api.ticdactoe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ticdactoe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $upstream http://grafana:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}